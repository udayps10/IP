spring.application.name=realestatepropertylistingsystem

# Active profile: "local" picks up application-local.properties (git ignored) for local secrets.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# MySQL (create the DB first: CREATE DATABASE realestate_db;)
spring.datasource.url=jdbc:mysql://localhost:3306/realestate_db
spring.datasource.username=root
# Override with the DB_PASSWORD environment variable or application-local.properties
spring.datasource.password=${DB_PASSWORD:your_password}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=property-photos

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Comma separated list of origins allowed to call the API from a browser (React dev server)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173